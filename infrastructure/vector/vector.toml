[sources.kernel_raw]
type = "kafka"
bootstrap_servers = "localhost:9092"
topics = ["kernel.raw"]
group_id = "vector-kprobe"
auto_offset_reset = "latest"

[sources.otel_traces]
type = "opentelemetry"
grpc.address = "0.0.0.0:4317"

[transforms.parse_raw]
type = "remap"
inputs = ["kernel_raw"]
source = '''
. = parse_json!(.message)
.ingested_at = now()
'''

[transforms.forward_to_clickhouse]
type = "remap"
inputs = ["parse_raw"]
source = '''
. = parse_raw
'''

[sinks.clickhouse]
type = "clickhouse"
inputs = ["forward_to_clickhouse"]
endpoint = "http://localhost:8123"
database = "kprobe"
table = "kernel_events"
compression = "gzip"
auth.strategy = "basic"
auth.user = "kprobe"
auth.password = "kprobe"

[sinks.clickhouse.encoding]
timestamp_format = "unix"

[sinks.kafka_enriched]
type = "kafka"
inputs = ["parse_raw"]
bootstrap_servers = "localhost:9092"
topic = "kernel.enriched"
compression = "none"

[sinks.kafka_enriched.encoding]
codec = "json"

[sinks.otel_logs]
type = "console"
inputs = ["otel_traces"]

[sinks.otel_logs.encoding]
codec = "json"