[sources.kafka_tcp]
type = "kafka"
bootstrap_servers = "localhost:9092"
topics = ["kernel.tcp"]
group_id = "vector-tcp"
auto_offset_reset = "latest"

[sources.kafka_sched]
type = "kafka"
bootstrap_servers = "localhost:9092"
topics = ["kernel.sched"]
group_id = "vector-sched"
auto_offset_reset = "latest"

[sources.kafka_syscall]
type = "kafka"
bootstrap_servers = "localhost:9092"
topics = ["kernel.syscall"]
group_id = "vector-syscall"
auto_offset_reset = "latest"

[sources.kafka_fault]
type = "kafka"
bootstrap_servers = "localhost:9092"
topics = ["kernel.fault"]
group_id = "vector-fault"
auto_offset_reset = "latest"

[sources.otel_traces]
type = "opentelemetry"
grpc.address = "0.0.0.0:4317"

# Parse raw kafka messages as JSON
[transforms.parse_tcp]
type = "remap"
inputs = ["kafka_tcp"]
source = '''
. = parse_json!(.message)
.source_topic = "kernel.tcp"
'''

[transforms.parse_sched]
type = "remap"
inputs = ["kafka_sched"]
source = '''
. = parse_json!(.message)
.source_topic = "kernel.sched"
'''

[transforms.parse_syscall]
type = "remap"
inputs = ["kafka_syscall"]
source = '''
. = parse_json!(.message)
.source_topic = "kernel.syscall"
'''

[transforms.parse_fault]
type = "remap"
inputs = ["kafka_fault"]
source = '''
. = parse_json!(.message)
.source_topic = "kernel.fault"
'''

# Merge all parsed events into one stream
[transforms.all_events]
type = "merge"
inputs = ["parse_tcp", "parse_sched", "parse_syscall", "parse_fault"]

# Enrich with OTel trace context by matching PID
[transforms.enrich_with_otel]
type = "remap"
inputs = ["all_events"]
source = '''
# Tag with ingestion timestamp
.ingested_at = now()

# Default trace fields — will be overwritten if OTel match found
.trace_id = "unknown"
.span_id = "unknown"
.service_name = "unknown"
.transaction_id = "unknown"
'''

# Write enriched events to ClickHouse
[sinks.clickhouse]
type = "clickhouse"
inputs = ["enrich_with_otel"]
endpoint = "http://localhost:8123"
database = "kprobe"
table = "kernel_events"
compression = "gzip"
auth.strategy = "basic"
auth.user = "kprobe"
auth.password = "kprobe"

[sinks.clickhouse.encoding]
timestamp_format = "unix"

# Publish enriched events back to Kafka for Go causal engine
[sinks.kafka_enriched]
type = "kafka"
inputs = ["enrich_with_otel"]
bootstrap_servers = "localhost:9092"
topic = "kernel.enriched"
compression = "none"

[sinks.kafka_enriched.encoding]
codec = "json"