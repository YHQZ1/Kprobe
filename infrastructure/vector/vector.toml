[sources.kernel_raw]
type = "kafka"
bootstrap_servers = "localhost:9092"
topics = ["kernel.raw"]
group_id = "vector-kprobe"
auto_offset_reset = "latest"

[sources.otel_traces]
type = "opentelemetry"
grpc.address = "0.0.0.0:4317"

[transforms.parse_raw]
type = "remap"
inputs = ["kernel_raw"]
source = '''
. = parse_json!(.message)
.ingested_at = now()
'''

[sinks.kafka_enriched]
type = "kafka"
inputs = ["parse_raw"]
bootstrap_servers = "localhost:9092"
topic = "kernel.enriched"
compression = "none"

[sinks.kafka_enriched.encoding]
codec = "json"

[sinks.kafka_otel_spans]
type = "kafka"
inputs = ["otel_traces"]
bootstrap_servers = "localhost:9092"
topic = "otel.spans"
compression = "none"

[sinks.kafka_otel_spans.encoding]
codec = "json"