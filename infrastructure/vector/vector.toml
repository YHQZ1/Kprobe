[api]
enabled = true
address = "0.0.0.0:8686"

[sources.kernel_raw]
type = "kafka"
bootstrap_servers = "kafka:29092"
topics = ["kernel.raw"]
group_id = "vector-kprobe"
auto_offset_reset = "latest"

[transforms.parse_raw]
type = "remap"
inputs = ["kernel_raw"]
source = '''
. = parse_json!(.message)
.ingested_at = now()
'''

[sinks.kafka_enriched]
type = "kafka"
inputs = ["parse_raw"]
bootstrap_servers = "kafka:29092"
topic = "kernel.enriched"
compression = "none"

[sinks.kafka_enriched.encoding]
codec = "json"
