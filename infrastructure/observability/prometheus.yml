global:
  scrape_interval: 15s

scrape_configs:
  - job_name: kprobe-api
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: kprobe-engine
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: kprobe-replay
    static_configs:
      - targets: ["host.docker.internal:8082"]